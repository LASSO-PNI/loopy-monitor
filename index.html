<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loopy Runs</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #18211f;
        --muted: #65706c;
        --line: #d7ded8;
        --paper: #fbfcf8;
        --panel: #ffffff;
        --hover: #f3f7f2;
        --bar-track: #e9eee9;
        --green: #2f7f63;
        --blue: #2d5b95;
        --gold: #9a6a16;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #edf4ef;
          --muted: #aebab4;
          --line: #2f3b35;
          --paper: #101512;
          --panel: #18201c;
          --hover: #202a25;
          --bar-track: #28332e;
          --green: #62c99d;
          --blue: #82b4f5;
          --gold: #d8ad5d;
        }
      }
      * { box-sizing: border-box; }
      html { background: var(--paper); }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { max-width: 1180px; margin: 0 auto; padding: 28px; }
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 20px;
        margin-bottom: 20px;
      }
      h1, h2, p { margin: 0; }
      h1 { font-size: 34px; line-height: 1.08; font-weight: 800; }
      h2 { font-size: 18px; margin-bottom: 12px; }
      .muted { color: var(--muted); }
      #generated {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        background: var(--panel);
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
        gap: 12px;
        margin: 20px 0;
      }
      .card, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .card { padding: 14px; }
      .card span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .card strong { display: block; margin-top: 8px; font-size: 30px; line-height: 1; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; }
      .panel { padding: 16px; margin-bottom: 18px; }
      .bar-row {
        display: grid;
        grid-template-columns: 104px minmax(120px, 1fr) 54px;
        align-items: center;
        gap: 10px;
        margin: 9px 0;
        font-size: 13px;
      }
      .bar-track { height: 12px; background: var(--bar-track); border-radius: 999px; overflow: hidden; }
      .bar-fill { display: block; height: 100%; background: var(--green); }
      .bar-fill.pickups { background: var(--blue); }
      .bar-fill.dropoffs { background: var(--gold); }
      table { width: 100%; min-width: 760px; border-collapse: collapse; }
      th, td { border-bottom: 1px solid var(--line); padding: 9px; text-align: left; vertical-align: top; }
      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        white-space: nowrap;
      }
      td { font-size: 13px; white-space: nowrap; }
      tbody tr:hover { background: var(--hover); }
      .table-wrap { overflow-x: auto; }
      a { color: var(--blue); }
      @media (max-width: 860px) {
        main { padding: 18px; }
        header { align-items: flex-start; flex-direction: column; }
        #generated { white-space: normal; }
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Loopy Runs</h1>
        </div>
        <div class="muted" id="generated">Loading history.json</div>
      </header>

      <section class="summary" id="summary"></section>

      <section class="layout">
        <div>
          <section class="panel">
            <h2>Daily Throughput</h2>
            <div id="bars" class="muted">Loading</div>
          </section>
        </div>

        <aside>
          <section class="panel">
            <h2>Range</h2>
            <p id="range" class="muted"></p>
          </section>
        </aside>
      </section>

      <section class="panel">
        <h2>Daily Counters</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Updated</th>
                <th>Cycles</th>
                <th>Sections</th>
                <th>Pickups</th>
                <th>Dropoffs</th>
                <th>Max Streak</th>
                <th>Build</th>
              </tr>
            </thead>
            <tbody id="day-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      function esc(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function(ch) {
          return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
        });
      }
      function num(value) {
        return typeof value === "number" && Number.isFinite(value) ? value : 0;
      }
      function formatEasternTimestamp(value) {
        if (!value) return "";
        var date = new Date(value);
        if (!Number.isFinite(date.getTime())) return String(value);
        return new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit",
          timeZoneName: "short"
        }).format(date);
      }
      function card(label, value) {
        return '<article class="card"><span>' + esc(label) + '</span><strong>' + esc(value) + '</strong></article>';
      }
      function row(day) {
        return '<tr><td>' + esc(day.date_eastern) + '</td><td>' + esc(day.last_updated_eastern || day.last_updated_utc) +
          '</td><td>' + esc(day.daily_full_auto_cycles) + '</td><td>' + esc(day.daily_section) +
          '</td><td>' + esc(day.daily_pickup) + '</td><td>' + esc(day.daily_dropoff) +
          '</td><td>' + esc(day.daily_max_consecutive_full_auto_cycles) + '</td><td>' + esc(day.build_sha) + '</td></tr>';
      }
      function bar(day, field, label, cls, maxValue) {
        var value = num(day[field]);
        var width = maxValue > 0 ? Math.round((value / maxValue) * 100) : 0;
        return '<div class="bar-row"><span>' + esc(day.date_eastern + " " + label) + '</span><div class="bar-track"><i class="bar-fill ' +
          esc(cls) + '" style="width:' + esc(width) + '%"></i></div><strong>' + esc(value) + '</strong></div>';
      }
      function draw(payload) {
        var days = Array.isArray(payload.days) ? payload.days : [];
        var summary = payload.summary || {};
        var range = payload.range || {};
        document.getElementById("generated").textContent =
          "Generated " + formatEasternTimestamp(payload.generated_at_utc);
        document.getElementById("summary").innerHTML =
          card("Days", num(summary.days)) +
          card("Full Auto Cycles", num(summary.daily_full_auto_cycles)) +
          card("Sections", num(summary.daily_section)) +
          card("Pickups", num(summary.daily_pickup)) +
          card("Dropoffs", num(summary.daily_dropoff)) +
          card("Best Streak", num(summary.best_daily_max_consecutive_full_auto_cycles));
        document.getElementById("range").innerHTML = esc((range.from || "start") + " to " + (range.to || "end")) +
          (payload.public_url ? '<br><a href="' + esc(payload.public_url) + '">' + esc(payload.public_url) + '</a>' : "");
        document.getElementById("day-rows").innerHTML = days.length ? days.map(row).join("") :
          '<tr><td colspan="8" class="muted">No counter history available</td></tr>';
        var maxValue = Math.max(1, ...days.map(function(day) {
          return Math.max(num(day.daily_section), num(day.daily_pickup), num(day.daily_dropoff));
        }));
        document.getElementById("bars").innerHTML = days.length ? days.map(function(day) {
          return bar(day, "daily_section", "sections", "", maxValue) +
            bar(day, "daily_pickup", "pickups", "pickups", maxValue) +
            bar(day, "daily_dropoff", "dropoffs", "dropoffs", maxValue);
        }).join("") : "No counter history available";
      }
      window.onload = function() {
        fetch("history.json", {cache: "no-store"})
          .then(function(response) { return response.json(); })
          .then(draw)
          .catch(function() {
            document.getElementById("generated").textContent = "Unable to load history.json";
          });
      };
    </script>
  </body>
</html>
