<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loopy Runs</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #18211f;
        --muted: #65706c;
        --line: #d7ded8;
        --paper: #fbfcf8;
        --panel: #ffffff;
        --hover: #f3f7f2;
        --bar-track: #e9eee9;
        --green: #2f7f63;
        --blue: #2d5b95;
        --gold: #9a6a16;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #edf4ef;
          --muted: #aebab4;
          --line: #2f3b35;
          --paper: #101512;
          --panel: #18201c;
          --hover: #202a25;
          --bar-track: #28332e;
          --green: #62c99d;
          --blue: #82b4f5;
          --gold: #d8ad5d;
        }
      }
      * { box-sizing: border-box; }
      html { background: var(--paper); }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { max-width: 1180px; margin: 0 auto; padding: 28px; }
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 20px;
        margin-bottom: 20px;
      }
      h1, h2, p { margin: 0; }
      h1 { font-size: 34px; line-height: 1.08; font-weight: 800; }
      h2 { font-size: 18px; margin-bottom: 12px; }
      .muted { color: var(--muted); }
      #generated {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        background: var(--panel);
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
        gap: 12px;
        margin: 20px 0;
      }
      .card, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .card { padding: 14px; }
      .card span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .card strong { display: block; margin-top: 8px; font-size: 30px; line-height: 1; }
      .panel { padding: 16px; margin-bottom: 18px; }
      .cycle-chart {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
        gap: 14px;
        min-height: 310px;
      }
      .chart-axis {
        display: grid;
        grid-template-rows: 1fr 1fr 1fr;
        align-items: start;
        justify-items: end;
        color: var(--muted);
        font-size: 12px;
        padding-top: 22px;
        padding-bottom: 48px;
      }
      .chart-axis span:last-child { align-self: end; }
      .chart-plot {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(116px, 1fr);
        gap: 18px;
        align-items: end;
        overflow-x: auto;
        min-height: 300px;
        padding: 22px 6px 0 0;
        border-left: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background:
          linear-gradient(to bottom, var(--bar-track) 1px, transparent 1px) 0 22px / 100% 80px repeat-y;
      }
      .cycle-bar-group {
        display: grid;
        grid-template-rows: 220px 46px;
        gap: 10px;
        align-items: end;
        min-width: 116px;
      }
      .cycle-bar-wrap {
        display: flex;
        align-items: end;
        justify-content: center;
        gap: 7px;
        height: 220px;
      }
      .throughput-bar {
        position: relative;
        width: 18px;
        min-height: 2px;
        height: var(--bar-height);
        border-radius: 6px 6px 0 0;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24);
      }
      .throughput-bar.cycles {
        width: 36px;
        background: linear-gradient(180deg, var(--green), var(--blue));
      }
      .throughput-bar.sections { background: var(--green); }
      .throughput-bar.pickups { background: var(--blue); }
      .throughput-bar.dropoffs { background: var(--gold); }
      .throughput-bar strong {
        position: absolute;
        left: 50%;
        top: -24px;
        transform: translateX(-50%);
        font-size: 13px;
        color: var(--ink);
      }
      .throughput-bar:not(.cycles) strong { display: none; }
      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        margin-bottom: 16px;
        color: var(--muted);
        font-size: 13px;
      }
      .legend-item { display: inline-flex; align-items: center; gap: 7px; }
      .legend-swatch {
        display: inline-block;
        height: 10px;
        border-radius: 999px;
      }
      .legend-swatch.cycles { width: 22px; background: linear-gradient(90deg, var(--green), var(--blue)); }
      .legend-swatch.sections { width: 11px; background: var(--green); }
      .legend-swatch.pickups { width: 11px; background: var(--blue); }
      .legend-swatch.dropoffs { width: 11px; background: var(--gold); }
      .cycle-label {
        color: var(--ink);
        font-size: 12px;
        font-weight: 800;
        line-height: 1.2;
        text-align: center;
        text-transform: uppercase;
      }
      .cycle-label span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-weight: 700;
        text-transform: none;
      }
      table { width: 100%; min-width: 760px; border-collapse: collapse; }
      th, td { border-bottom: 1px solid var(--line); padding: 9px; text-align: left; vertical-align: top; }
      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        white-space: nowrap;
      }
      td { font-size: 13px; white-space: nowrap; }
      tbody tr:hover { background: var(--hover); }
      .table-wrap { overflow-x: auto; }
      a { color: var(--blue); }
      @media (max-width: 860px) {
        main { padding: 18px; }
        header { align-items: flex-start; flex-direction: column; }
        #generated { white-space: normal; }
        .cycle-chart { grid-template-columns: 42px minmax(0, 1fr); }
        .chart-plot { grid-auto-columns: 104px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Loopy Runs</h1>
        </div>
        <div class="muted" id="generated">Loading history.json</div>
      </header>

      <section class="summary" id="summary"></section>

      <section class="panel">
        <h2>Daily Throughput</h2>
        <div id="cycle-chart" class="muted">Loading</div>
      </section>

      <section class="panel">
        <h2>Daily Counters</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Updated</th>
                <th>Cycles</th>
                <th>Sections</th>
                <th>Pickups</th>
                <th>Dropoffs</th>
                <th>Max Streak</th>
                <th>Build</th>
              </tr>
            </thead>
            <tbody id="day-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      function esc(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function(ch) {
          return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
        });
      }
      function num(value) {
        return typeof value === "number" && Number.isFinite(value) ? value : 0;
      }
      function formatEasternTimestamp(value) {
        if (!value) return "";
        var date = new Date(value);
        if (!Number.isFinite(date.getTime())) return String(value);
        return new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit",
          timeZoneName: "short"
        }).format(date);
      }
      function formatShortDate(value) {
        var parts = String(value || "").split("-");
        if (parts.length !== 3) return value || "";
        return Number(parts[1]) + "/" + Number(parts[2]);
      }
      function isWeekend(day) {
        var parts = String(day.date_eastern || "").split("-").map(Number);
        if (parts.length !== 3 || parts.some(function(part) { return !Number.isFinite(part); })) return false;
        var weekday = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 12)).getUTCDay();
        return weekday === 0 || weekday === 6;
      }
      function dayHasRun(day) {
        return num(day.daily_full_auto_cycles) > 0 ||
          num(day.daily_section) > 0 ||
          num(day.daily_pickup) > 0 ||
          num(day.daily_dropoff) > 0;
      }
      function displayDays(days) {
        return days.filter(function(day) {
          return dayHasRun(day) || !isWeekend(day);
        });
      }
      function card(label, value) {
        return '<article class="card"><span>' + esc(label) + '</span><strong>' + esc(value) + '</strong></article>';
      }
      function row(day) {
        return '<tr><td>' + esc(day.date_eastern) + '</td><td>' + esc(day.last_updated_eastern || day.last_updated_utc) +
          '</td><td>' + esc(day.daily_full_auto_cycles) + '</td><td>' + esc(day.daily_section) +
          '</td><td>' + esc(day.daily_pickup) + '</td><td>' + esc(day.daily_dropoff) +
          '</td><td>' + esc(day.daily_max_consecutive_full_auto_cycles) + '</td><td>' + esc(day.build_sha) + '</td></tr>';
      }
      function cycleChart(days) {
        if (!days.length) return "No counter history available";
        var metrics = [
          {field: "daily_full_auto_cycles", label: "Full auto cycles", cls: "cycles"},
          {field: "daily_section", label: "Sections", cls: "sections"},
          {field: "daily_pickup", label: "Pickups", cls: "pickups"},
          {field: "daily_dropoff", label: "Dropoffs", cls: "dropoffs"}
        ];
        var maxValue = Math.max(1, ...days.map(function(day) {
          return Math.max(...metrics.map(function(metric) {
            return num(day[metric.field]);
          }));
        }));
        var halfValue = Math.round(maxValue / 2);
        var legend = '<div class="chart-legend">' + metrics.map(function(metric) {
          return '<span class="legend-item"><i class="legend-swatch ' + esc(metric.cls) +
            '"></i>' + esc(metric.label) + '</span>';
        }).join("") + '</div>';
        var bars = days.map(function(day, index) {
          var metricBars = metrics.map(function(metric) {
            var value = num(day[metric.field]);
            var height = maxValue > 0 ? Math.round((value / maxValue) * 100) : 0;
            if (value > 0) height = Math.max(3, height);
            return '<div class="throughput-bar ' + esc(metric.cls) + '" title="' +
              esc(metric.label + ": " + value) + '" style="--bar-height:' +
              esc(height) + '%"><strong>' + esc(value) + '</strong></div>';
          }).join("");
          return '<div class="cycle-bar-group"><div class="cycle-bar-wrap">' +
            metricBars + '</div><div class="cycle-label">Day ' +
            esc(index + 1) + '<span>' + esc(formatShortDate(day.date_eastern)) + '</span></div></div>';
        }).join("");
        return legend + '<div class="cycle-chart" aria-label="Daily throughput count chart"><div class="chart-axis"><span>' +
          esc(maxValue) + '</span><span>' + esc(halfValue) + '</span><span>0</span></div><div class="chart-plot">' +
          bars + '</div></div>';
      }
      function draw(payload) {
        var sourceDays = Array.isArray(payload.days) ? payload.days : [];
        var days = displayDays(sourceDays);
        var summary = payload.summary || {};
        document.getElementById("generated").textContent =
          "Generated " + formatEasternTimestamp(payload.generated_at_utc);
        document.getElementById("summary").innerHTML =
          card("Days", num(summary.days)) +
          card("Full Auto Cycles", num(summary.daily_full_auto_cycles)) +
          card("Sections", num(summary.daily_section)) +
          card("Pickups", num(summary.daily_pickup)) +
          card("Dropoffs", num(summary.daily_dropoff)) +
          card("Best Streak", num(summary.best_daily_max_consecutive_full_auto_cycles));
        document.getElementById("day-rows").innerHTML = days.length ? days.map(row).join("") :
          '<tr><td colspan="8" class="muted">No counter history available</td></tr>';
        document.getElementById("cycle-chart").innerHTML = cycleChart(days);
      }
      window.onload = function() {
        fetch("history.json", {cache: "no-store"})
          .then(function(response) { return response.json(); })
          .then(draw)
          .catch(function() {
            document.getElementById("generated").textContent = "Unable to load history.json";
          });
      };
    </script>
  </body>
</html>
